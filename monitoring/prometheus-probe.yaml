apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter
  endpoints:
    - port: http
      interval: 30s
      path: /probe
      params:
        module: [http_2xx]
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: pccs-probe
  namespace: monitoring
spec:
  jobName: pccs
  prober:
    url: http://blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        # PCCS Service (release "pccs" in namespace "pccs"); adjust if you
        # installed under a different release name or namespace. Point this at
        # the ingress host instead to also cover the controller and the
        # backend TLS hop, if that name resolves from this namespace.
        # /healthz/ready runs a real query against the caching database, so
        # probe_duration_seconds tracks DB round-trip latency. Sustained DB
        # failure removes the pod from the headless Service's DNS, so it
        # surfaces as a connection failure rather than a 503.
        - https://pccs.pccs.svc.cluster.local:8081/healthz/ready
---
# Alerts on the HTTPS server certificate each PCCS pod presents (the
# <release>-tls Secret), not the PCK certificates PCCS serves as collateral.
# The probe above skips certificate verification, so it stays green when the
# ingress rejects a PCCS pod over that certificate, but it still records its
# expiry: cert-manager renews it 15 days before
# expiry and PCCS reloads it within minutes (pccsConfig.tlsReloadIntervalSeconds).
#
# The Service is headless, so each probe reaches one of the pods; the hour-long
# window makes sure every pod has been sampled.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pccs-server-tls
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: pccs-server-tls
      rules:
        - alert: PccsServerTlsCertNotRenewed
          expr: min_over_time(probe_ssl_earliest_cert_expiry{job="pccs"}[1h]) - time() < 7 * 86400
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A PCCS pod serves an HTTPS server certificate that expires in {{ $value | humanizeDuration }}"
            description: >-
              A PCCS pod still serves an HTTPS server certificate that
              cert-manager should have renewed 8+ days ago. Check `kubectl get certificate -n pccs`
              and the pod log for "Cannot load the new HTTPS key"; restarting
              the pod makes it read the current certificate.
        - alert: PccsServerTlsCertExpiring
          expr: min_over_time(probe_ssl_earliest_cert_expiry{job="pccs"}[1h]) - time() < 86400
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "A PCCS pod's HTTPS server certificate expires in {{ $value | humanizeDuration }}"
            description: >-
              Once it expires the ingress rejects this pod. Restart it so it
              reads the current certificate, then find out why the reload
              failed (see PccsServerTlsCertNotRenewed).
