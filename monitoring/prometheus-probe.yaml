apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter
  endpoints:
    - port: http
      interval: 30s
      path: /probe
      params:
        module: [http_2xx]
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: pccs-probe
  namespace: monitoring
spec:
  jobName: pccs
  prober:
    url: http://blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        # PCCS Service (release "pccs" in namespace "pccs"); adjust if you
        # installed under a different release name or namespace. Point this at
        # the ingress host instead to also cover the controller and the
        # backend TLS hop, if that name resolves from this namespace.
        # /healthz/ready runs a real query against the caching database, so
        # probe_duration_seconds tracks DB round-trip latency. Sustained DB
        # failure removes the pod from the headless Service's DNS, so it
        # surfaces as a connection failure rather than a 503.
        - https://pccs.pccs.svc.cluster.local:8081/healthz/ready
