name: PR Workflow

on:
  pull_request:
    branches:
      - main

# Least privilege by default; jobs that push images widen it explicitly.
permissions:
  contents: read

# A new push to the same PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -print0 | xargs -0 shellcheck

      - name: Check PCCS version references agree
        run: bash tests/check-versions.sh

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  build:
    name: Build PCCS image
    needs: lint
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      repository: ${{ steps.image.outputs.repository }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}/pccs" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PCCS image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/pccs/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      # Single source of truth for the tool and chart versions installed by
      # tests/install-tools.sh and tests/setup-environment.sh.
      KUBECTL_VERSION: v1.32.5
      K3D_VERSION: v5.9.0
      CERT_MANAGER_VERSION: v1.18.2
      # config.env is the template for local runs and the contract of required
      # names: tests/utils.sh check_required_envs reads its export lines and
      # fails the run if any is unset. This block supplies CI's values for
      # exactly that set; a name added to config.env must be added here too.
      CLUSTER_NAME: pr-test-cluster
      DCAP_KEY: ${{ secrets.DCAP_KEY }}
      KUBECONFIG: ./tests/tmp/kubeconfig
      PCCS_URL: pccs.example.com
      PCCS_ADMIN_TOKEN: admin_password
      PCCS_USER_TOKEN: user_password
      IMAGE_REGISTRY: ghcr.io
      IMAGE_USERNAME: ${{ github.actor }}
      IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_EMAIL: ${{ secrets.IMAGE_EMAIL || format('{0}@users.noreply.github.com', github.actor) }}
      PCCS_IMAGE_REPOSITORY: ${{ needs.build.outputs.repository }}
      PCCS_IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run integration tests
        run: bash tests/run-all.sh

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-output
          path: |
            tests/tmp/
            !tests/tmp/kubeconfig
          if-no-files-found: ignore
          retention-days: 7
