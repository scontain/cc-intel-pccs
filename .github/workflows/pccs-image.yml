name: Publish PCCS image

on:
  push:
    branches:
      - main
    paths:
      - container/pccs/**
      - charts/pccs/Chart.yaml
      - .github/workflows/pccs-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push PCCS image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check PCCS version references agree
        run: bash tests/check-versions.sh

      - name: Resolve image name and tags
        id: image
        # The chart's appVersion is the source of truth: appVersion 1.27.0
        # publishes v1.27.0
        run: |
          app_version=$(sed -nE 's/^appVersion: *"?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/p' charts/pccs/Chart.yaml)
          test -n "$app_version" || { echo "appVersion not found in charts/pccs/Chart.yaml" >&2; exit 1; }
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/pccs"
          {
            echo "repository=$repository"
            echo "tags<<EOT"
            echo "$repository:v$app_version"
            echo "$repository:v${app_version%.*}"
            echo "$repository:latest"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PCCS v1.27 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/pccs/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
