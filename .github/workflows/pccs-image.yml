name: Publish PCCS image

on:
  push:
    branches:
      - main
    paths:
      - container/pccs/**
      - .github/workflows/pccs-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PCCS v1.26 image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/pccs
        run: |
          docker build \
            --tag "$IMAGE_REPOSITORY:v1.26" \
            --tag "$IMAGE_REPOSITORY:latest" \
            --file container/pccs/Dockerfile .
          docker push "$IMAGE_REPOSITORY:v1.26"
          docker push "$IMAGE_REPOSITORY:latest"
